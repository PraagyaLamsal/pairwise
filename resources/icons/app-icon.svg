<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141B2E"/>
      <stop offset="1" stop-color="#0A0D16"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.42" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#2F7BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DB2FF"/>
      <stop offset="0.55" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#1D4FD8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="2.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
    <!-- student ink: a hand-drawn loop -->
    <path d="M 610 640 C 520 640, 470 700, 500 760 C 535 828, 690 838, 752 778 C 806 726, 770 640, 676 628 C 640 623, 606 632, 584 650"
          fill="none" stroke="#FF8A1F" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <!-- tutor cursor -->
    <g filter="url(#glow)" transform="translate(300 250) rotate(-8)">
      <path d="M0 0 L330 186 L186 226 L118 368 Z" fill="url(#cursor)" stroke="#CFE2FF" stroke-width="10" stroke-linejoin="round"/>
    </g>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
</svg>
